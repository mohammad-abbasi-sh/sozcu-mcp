[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sozcu-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for sozcu.com.tr news (headlines, articles, search, rates)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
sozcu-mcp = "sozcu_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sozcu_mcp"]
